services:
  - type: web
    name: fusion-engine-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false   # set this manually in the Render dashboard
    healthCheckPath: /
